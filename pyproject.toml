[project]
name = "agentic-retrieval"
version = "0.1.0"
description = "Standalone Python RAG retrieval service"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "langchain-core==1.0.0",
  "python-dotenv==1.2.3",
  "psycopg[binary]==3.2.10",
  "minio==7.2.16",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
